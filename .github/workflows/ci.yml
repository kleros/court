name: CI

# Checks the app on every pull request and on pushes to master (only master, so a pull request's branch is checked
# once per push): secret scan of the files, install from the lockfile, typecheck, lint, unit tests, production build
# (no environment needed) and a check that only the app's public variables reach it, then end-to-end tests (smoke,
# script runner) in headless Chromium on a build with a placeholder Reown project id (so AppKit loads, as in
# production), and the kernel's fetch-cache test in headless WebKit, Chromium and Firefox.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The branch must carry no committed secret. Scans the checked-out files only (not the history), before Install
      # so dependencies are not scanned. The gitleaks release is pinned by the sha256 that its own checksums file and
      # GitHub's asset digest both give; any other download fails the check. The rules are .gitleaks.toml (the defaults
      # plus a Travis-style Slack token rule), named with --config so no GITLEAKS_CONFIG variable can replace them.
      - name: Secret scan (gitleaks 8.30.1, checked-out files)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-git --source . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn version from package.json)
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      # One REACT_APP_ variable the app does not use is planted in the build's environment: the check fails if its name
      # or its value, or any REACT_APP_ name outside the app's public list (ENV_KEYS), is in the build.
      - name: Build, then check that only the app's public variables reached it
        run: |
          yarn build
          node packages/web/scripts/check-bundle-env.mjs packages/web/dist
        env:
          REACT_APP_PLANTED_NOT_PUBLIC: planted-value-that-must-not-reach-the-bundle

      # Not a real project id: the tests reach nothing outside their local server.
      - name: Build the end-to-end target (placeholder Reown project id)
        run: yarn workspace @court/web build
        env:
          REACT_APP_WALLETCONNECT_PROJECT_ID: "00000000000000000000000000000000"

      # Into Playwright's cache in the runner's home (~/.cache/ms-playwright), never the repository. Firefox and WebKit
      # for the kernel's fetch-cache test (e2e/kernel), which checks each engine's own HTTP cache.
      - name: Install Chromium, Firefox and WebKit for the end-to-end tests
        run: yarn workspace @court/web playwright install --with-deps --only-shell chromium firefox webkit

      # Same id as the build above: the tests then require AppKit to have loaded (Connect shown, its window opens).
      # Every spec under packages/web/e2e: the smoke tests, the script runner's and the kernel's fetch-cache test.
      - name: End-to-end tests (smoke, script runner, kernel fetch cache)
        run: yarn workspace @court/web e2e
        env:
          REACT_APP_WALLETCONNECT_PROJECT_ID: "00000000000000000000000000000000"

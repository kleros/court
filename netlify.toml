[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.3"
  YARN_VERSION = "4.18.1"

# snapshots.json is the published list of monthly reward snapshot CIDs.
# It is read by various consumers, so it needs CORS.
[[headers]]
  for = "/snapshots.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "https://kleros-court.netlify.com/*"
  to = "https://court.kleros.io/:splat"
  status = 301
  force = true
